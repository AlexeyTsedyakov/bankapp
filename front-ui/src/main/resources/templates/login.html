<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bankapp</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>

<body>
<header class="section is-flex is-justify-content-space-between is-align-items-center">
    <div>
        <span class="title">Bankapp</span>
    </div>
    <div sec:authorize="isAuthenticated()">
        <span sec:authentication="name">Username</span>
        <form class="is-display-inline" th:action="@{/logout}" method="post">
            <button type="submit" class="button is-ghost has-text-danger p-0">Выйти</button>
        </form>
    </div>
</header>

<main class="has-background">
    <section class="section is-flex is-justify-content-center">
        <div class="columns">
            <div class="column is-narrow">
                <div class="card" style="width: 400px">
                    <header class="card-header">
                        <p class="card-header-title">Вход</p>
                    </header>

                    <form class="card-content" th:action="@{/login}" method="post">
                        <div th:if="${errorMessage}" class="notification is-danger is-light"
                             x-data="{ show: true }" x-show="show" x-transition>
                            <button class="delete" type="button" @click="show = false"></button>
                            <span th:text="${errorMessage}">Неверные логин или пароль</span>
                        </div>

                        <div class="field">
                            <label class="label">Логин</label>
                            <div class="control">
                                <input class="input" type="text" name="username"
                                       placeholder="Логин" required autofocus>
                            </div>
                        </div>

                        <div class="field" x-data="{ show: false }">
                            <label class="label">Пароль</label>
                            <div class="control has-icons-right">
                                <input class="input" :type="show ? 'text' : 'password'" name="password"
                                       placeholder="********" required>
                                <span class="icon is-right" @click="show = !show"
                                      style="pointer-events: all; cursor: pointer;">
                                        <i class="fa-solid" :class="show ? 'fa-eye-slash' : 'fa-eye'"></i>
                                </span>
                            </div>
                        </div>

                        <div class="field is-grouped is-grouped-centered">
                            <div class="control">
                                <button class="button is-success" type="submit">Войти</button>
                            </div>
                            <div class="control">
                                <a class="button is-warning" th:href="@{/register}">Создать аккаунт</a>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </section>
</main>
</body>
