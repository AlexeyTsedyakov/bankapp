server:
  port: 0
  forward-headers-strategy: native

spring:
  application:
    name: front-ui
  config:
    import: optional:file:./.env[.properties]

  cloud:
    consul:
      host: ${CONSUL_HOST}
      port: ${CONSUL_PORT}
      discovery:
        instance-id: ${spring.application.name}:${random.uuid}

  mvc:
    hiddenmethod:
      filter:
        enabled: true

  security:
    oauth2:
      client:
        registration:
          oauth2-service-client:
            provider: keycloak
            client-id: front-ui
            client-secret: ${KC_CLIENT_SECRET_FRONT_UI}
            authorization-grant-type: client_credentials
            scope:
              - openid
        provider:
          keycloak:
            issuer-uri: http://${KC_HTTP_HOST}:${KC_HTTP_PORT}/realms/${KC_REALM}

  http:
    serviceclient:
      api-gateway:
        base-url: http://${API_GATEWAY_HOST}:${API_GATEWAY_PORT}