server:
  port: 8080

spring:
  application:
    name: front-ui
  config:
    import: optional:file:./.env[.properties]

  mvc:
    hiddenmethod:
      filter:
        enabled: true

  security:
    oauth2:
      client:
        registration:
          oauth2-service-client:
            provider: keycloak
            client-id: front-ui
            client-secret: ${KC_CLIENT_SECRET_FRONT_UI}
            authorization-grant-type: client_credentials
            scope:
              - openid
        provider:
          keycloak:
            issuer-uri: http://${KC_HTTP_HOST}:${KC_HTTP_PORT}/realms/${KC_REALM}

  http:
    serviceclient:
      accounts:
        base-url: http://localhost:8090
      cash:
        base-url: http://localhost:8091