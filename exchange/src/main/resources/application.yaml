server:
  port: 0
  forward-headers-strategy: native

spring:
  application:
    name: exchange
  config:
    import: optional:file:./.env[.properties]

  cloud:
    consul:
      host: localhost
      port: 8500
      discovery:
        instance-id: ${spring.application.name}:${random.uuid}

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://${KC_HTTP_HOST}:${KC_HTTP_PORT}/realms/${KC_REALM}
        server-id: exchange