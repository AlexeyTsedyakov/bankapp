server:
  port: 8091

spring:
  application:
    name: cash
  config:
    import: optional:file:./.env[.properties]

  mvc:
    servlet:
      path: /api/cash

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}?currentSchema=cash
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

  flyway:
    enabled: true
    schemas: cash
    create-schemas: true
    locations: classpath:db/migration

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://${KC_HTTP_HOST}:${KC_HTTP_PORT}/realms/${KC_REALM}
        server-id: cash
      client:
        registration:
          oauth2-service-client:
            provider: keycloak
            client-id: cash
            client-secret: ${KC_CLIENT_SECRET_CASH}
            authorization-grant-type: client_credentials
            scope:
              - openid
        provider:
          keycloak:
            issuer-uri: http://${KC_HTTP_HOST}:${KC_HTTP_PORT}/realms/${KC_REALM}

  http:
    serviceclient:
      accounts:
        base-url: http://localhost:8090/api/accounts
      blocker:
        base-url: http://localhost:8094/api/blocker
      notifications:
        base-url: http://localhost:8095/api/notifications