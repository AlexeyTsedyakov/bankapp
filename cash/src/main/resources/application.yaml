server:
  port: 8091

spring:
  application:
    name: cash
  config:
    import: optional:file:./.env[.properties]

  mvc:
    servlet:
      path: /api/cash

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://${KC_HTTP_HOST}:${KC_HTTP_PORT}/realms/${KC_REALM}
        server-id: cash
      client:
        registration:
          oauth2-service-client:
            provider: keycloak
            client-id: cash
            client-secret: ${KC_CLIENT_SECRET_CASH}
            authorization-grant-type: client_credentials
            scope:
              - openid
        provider:
          keycloak:
            issuer-uri: http://${KC_HTTP_HOST}:${KC_HTTP_PORT}/realms/${KC_REALM}

  http:
    serviceclient:
      accounts:
        base-url: http://localhost:8090/api/accounts