server:
  port: 8090

spring:
  application:
    name: accounts
  config:
    import: optional:file:./.env[.properties]

  mvc:
    servlet:
      path: /accounts

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}?currentSchema=accounts
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

  flyway:
    enabled: true
    locations: classpath:db/migration

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://${KC_HTTP_HOST}:${KC_HTTP_PORT}/realms/${KC_REALM}
      client:
        registration:
          oauth2-service-client:
            provider: keycloak
            client-id: accounts
            client-secret: ${KC_CLIENT_SECRET_ACCOUNTS}
            authorization-grant-type: client_credentials
            scope:
              - openid
        provider:
          keycloak:
            issuer-uri: http://${KC_HTTP_HOST}:${KC_HTTP_PORT}/realms/${KC_REALM}