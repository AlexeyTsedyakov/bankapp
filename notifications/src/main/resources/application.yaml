server:
  port: 0
  forward-headers-strategy: native

spring:
  application:
    name: notifications
  config:
    import: optional:file:./.env[.properties]

  cloud:
    consul:
      host: ${CONSUL_HOST}
      port: ${CONSUL_PORT}
      discovery:
        instance-id: ${spring.application.name}:${random.uuid}

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}?currentSchema=notifications
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

  flyway:
    enabled: true
    schemas: notifications
    create-schemas: true
    locations: classpath:db/migration

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://${KC_HTTP_HOST}:${KC_HTTP_PORT}/realms/${KC_REALM}
        server-id: notifications

  mail:
    host: ${MAILPIT_HOST}
    port: ${MAILPIT_SMTP_PORT}
    protocol: smtp