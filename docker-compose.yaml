x-spring-healthcheck: &spring-healthcheck
  test: [ "CMD", "wget", "-q", "--spider", "-T", "2", "http://127.0.0.1:9090/actuator/health/readiness" ]
  interval: 5s
  timeout: 3s
  retries: 30
  start_period: 30s

x-spring-health-env: &spring-health-env
  MANAGEMENT_SERVER_PORT: "9090"
  MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"

services:
  db:
    image: postgres:18.6-alpine
    ports:
      - "${POSTGRES_PORT}:${POSTGRES_PORT}"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    ports:
      - "${KC_HTTP_PORT}:${KC_HTTP_PORT}"
      - "${KC_HTTP_MANAGEMENT_PORT}:${KC_HTTP_MANAGEMENT_PORT}"
    environment:
      KC_HTTP_PORT: ${KC_HTTP_PORT}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD}
      KC_HEALTH_ENABLED: "true"
    command:
      - start-dev
      - --import-realm
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    healthcheck:
      test: "exec 3<>/dev/tcp/localhost/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '\"status\": \"UP\"'"
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 30s

  consul:
    image: hashicorp/consul:2.1.0
    command:
      - agent
      - -dev
      - -client=0.0.0.0
    ports:
      - "${CONSUL_PORT}:${CONSUL_PORT}"
    volumes:
      - consul_data:/consul/data
    healthcheck:
      test: [ "CMD", "consul", "info" ]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.32.0
    restart: unless-stopped
    environment:
      MP_SMTP_DISABLE_RDNS: "true"
      MP_UI_BIND_ADDR: "0.0.0.0:${MAILPIT_UI_PORT}"
      MP_SMTP_BIND_ADDR: "0.0.0.0:${MAILPIT_SMTP_PORT}"
    ports:
#      - "${MAILPIT_SMTP_PORT}:${MAILPIT_SMTP_PORT}"
      - "${MAILPIT_UI_PORT}:${MAILPIT_UI_PORT}"
    healthcheck:
      test: [ "CMD", "/mailpit", "readyz" ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  api-gateway:
    build: ./api-gateway
    ports:
      - "${API_GATEWAY_PORT}:${API_GATEWAY_PORT}"
    env_file:
      - ./.env
    environment:
      CONSUL_HOST: "consul"
      <<: *spring-health-env
    healthcheck: *spring-healthcheck
    depends_on:
      consul:
        condition: service_healthy

  accounts:
    build: ./accounts
    env_file:
      - ./.env
    environment:
      CONSUL_HOST: "consul"
      POSTGRES_HOST: "db"
      KC_HTTP_HOST: "keycloak"
      API_GATEWAY_HOST: "api-gateway"
      <<: *spring-health-env
    healthcheck: *spring-healthcheck
    depends_on:
      api-gateway:
        condition: service_healthy
      db:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  blocker:
    build: ./blocker
    env_file:
      - ./.env
    environment:
      CONSUL_HOST: "consul"
      KC_HTTP_HOST: "keycloak"
      <<: *spring-health-env
    healthcheck: *spring-healthcheck
    depends_on:
      api-gateway:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  cash:
    build: ./cash
    env_file:
      - ./.env
    environment:
      CONSUL_HOST: "consul"
      POSTGRES_HOST: "db"
      KC_HTTP_HOST: "keycloak"
      API_GATEWAY_HOST: "api-gateway"
      <<: *spring-health-env
    healthcheck: *spring-healthcheck
    depends_on:
      api-gateway:
        condition: service_healthy
      db:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  exchange:
    build: ./exchange
    env_file:
      - ./.env
    environment:
      CONSUL_HOST: "consul"
      KC_HTTP_HOST: "keycloak"
      <<: *spring-health-env
    healthcheck: *spring-healthcheck
    depends_on:
      api-gateway:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  exchange-generator:
    build: ./exchange-generator
    env_file:
      - ./.env
    environment:
      KC_HTTP_HOST: "keycloak"
      API_GATEWAY_HOST: "api-gateway"
      <<: *spring-health-env
    healthcheck: *spring-healthcheck
    depends_on:
      api-gateway:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      exchange:
        condition: service_healthy

  front-ui:
    build: ./front-ui
    env_file:
      - ./.env
    environment:
      CONSUL_HOST: "consul"
      KC_HTTP_HOST: "keycloak"
      API_GATEWAY_HOST: "api-gateway"
      <<: *spring-health-env
    healthcheck: *spring-healthcheck
    depends_on:
      api-gateway:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  notifications:
    build: ./notifications
    env_file:
      - ./.env
    environment:
      CONSUL_HOST: "consul"
      POSTGRES_HOST: "db"
      KC_HTTP_HOST: "keycloak"
      MAILPIT_HOST: "mailpit"
      <<: *spring-health-env
    healthcheck: *spring-healthcheck
    depends_on:
      api-gateway:
        condition: service_healthy
      db:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      mailpit:
        condition: service_healthy

  transfer:
    build: ./transfer
    env_file:
      - ./.env
    environment:
      CONSUL_HOST: "consul"
      POSTGRES_HOST: "db"
      KC_HTTP_HOST: "keycloak"
      API_GATEWAY_HOST: "api-gateway"
      <<: *spring-health-env
    healthcheck: *spring-healthcheck
    depends_on:
      api-gateway:
        condition: service_healthy
      db:
        condition: service_healthy
      keycloak:
        condition: service_healthy

volumes:
  postgres_data:
  keycloak_data:
  consul_data: