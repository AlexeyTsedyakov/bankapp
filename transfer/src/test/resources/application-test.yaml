spring:
  config:
    import: optional:file:../.env[.properties]

  cloud:
    consul:
      enabled: false

  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;INIT=CREATE SCHEMA IF NOT EXISTS transfer\;SET SCHEMA transfer
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: false

logging:
  level:
    org.springframework.jdbc.core.JdbcTemplate: DEBUG
